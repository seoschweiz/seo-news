name: SEO Schweiz relationship metadata
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seo-schweiz-relationship
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add structured relationship metadata
        shell: python
        run: |
          from pathlib import Path
          marker = 'id="seo-schweiz-relationship"'
          relation = '"publisher":{"@id":"https://seoschweiz.net/#organization"}'
          old_org = '{"@type":"Organization","@id":"https://seoschweiz.net/#organization","name":"SEO Schweiz","url":"https://seoschweiz.net/"}'
          rich_org = '{"@type":"Organization","@id":"https://seoschweiz.net/#organization","name":"SEO Schweiz","url":"https://seoschweiz.net/","parentOrganization":{"@id":"https://diversico.ch/#organization"},"sameAs":["https://www.facebook.com/seo.schweiz/","https://www.facebook.com/seo.switzerland/","https://www.facebook.com/suisse.seo/","https://www.facebook.com/seo.svizzera/","https://www.youtube.com/@seo.schweiz","https://www.pinterest.com/seomarketingschweiz/"]},{"@type":"Organization","@id":"https://diversico.ch/#organization","name":"Diversico GmbH","legalName":"Diversico GmbH","url":"https://diversico.ch/","taxID":"CHE-241.775.499","address":{"@type":"PostalAddress","streetAddress":"Adlikerstrasse 246","postalCode":"8105","addressLocality":"Regensdorf","addressCountry":"CH"}}'
          snippet = '<script id="seo-schweiz-relationship" type="application/ld+json">{"@context":"https://schema.org","@graph":[' + rich_org + ',{"@type":"WebPage","publisher":{"@id":"https://seoschweiz.net/#organization"}}]}</script>'
          changed = 0
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8', errors='ignore')
              low = text.lower()
              if 'name="robots"' in low and 'noindex' in low:
                  continue
              if marker in text:
                  if old_org in text:
                      path.write_text(text.replace(old_org, rich_org), encoding='utf-8')
                      changed += 1
                  continue
              if relation in text or '</head>' not in low:
                  continue
              pos = low.rfind('</head>')
              path.write_text(text[:pos] + snippet + '\n' + text[pos:], encoding='utf-8')
              changed += 1
          print(f'Updated {changed} HTML files')
      - name: Commit generated metadata
        run: |
          git config user.name "SEO Schweiz Automation"
          git config user.email "automation@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add full SEO Schweiz company and social profile"
          git push

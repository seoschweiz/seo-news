name: Update SEO News

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update SEO news and RSS feeds
        run: python update_news.py

      - name: Commit updated news and RSS feeds
        run: |
          git config user.name "SEO News Bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            de/index.html \
            de/feed.xml \
            en/index.html \
            en/feed.xml \
            fr/index.html \
            fr/feed.xml \
            it/index.html \
            it/feed.xml \
            es/index.html \
            es/feed.xml \
            pt/index.html \
            pt/feed.xml \
            sitemap.xml

          git diff --cached --quiet || git commit -m "Automatic multilingual SEO news and RSS update"
          git push
